<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#53663a">
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="P3 Usinas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default"><title>P3 · Entrar</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef1ea;font-family:system-ui,"Segoe UI",Arial,sans-serif;color:#1c2b22}
form{background:#fff;padding:28px 24px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.08);width:min(340px,calc(100vw - 32px));box-sizing:border-box}
.lp{height:46px;width:auto;display:block}.lp .lg-a{fill:#7b934a}.lp .lg-b{fill:#9aae2e}
h1{font-size:18px;margin:14px 0 4px}p{margin:0 0 18px;color:#5b6b61;font-size:14px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cdd6cf;border-radius:8px;font-size:16px;margin-bottom:10px}
button{margin-top:2px;width:100%;padding:12px;border:0;border-radius:8px;background:#53663a;color:#fff;font-size:15px;font-weight:600;cursor:pointer}button:disabled{opacity:.6}.e{color:#b3261e;font-size:14px;margin-top:10px}</style></head>
<body><form id="f"><svg class="lp" viewBox="129 169 1743 757" role="img" aria-label="P3 Energy"><path class="lg-a" d="M129 169H993V623H320V461H817V313H287V926H129Z"/><path class="lg-b" d="M1052 169H1872V926H1052V771H1731V313H1052Z"/><rect class="lg-b" x="1061" y="461" width="636" height="162"/><text class="lg-a" x="330" y="923" font-size="206" textLength="690" lengthAdjust="spacingAndGlyphs" font-family="'Arial Narrow','Roboto Condensed',Arial,sans-serif">ENERGY</text></svg><h1>Gestão de Usinas</h1><p>Entre com o seu e-mail e senha.</p>
<input type="email" id="email" placeholder="E-mail" autocomplete="username" required autofocus>
<input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
<button id="b">Entrar</button><div class="e" id="e" role="alert"></div></form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(P3_CONFIG.url, P3_CONFIG.chave);
const erro = t => { document.getElementById("e").textContent = t; };
sb.auth.getSession().then(({ data }) => { if (data.session) location.href = "index.html"; });
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const b = document.getElementById("b");
  b.disabled = true; erro("");
  const r = await sb.auth.signInWithPassword({ email: document.getElementById("email").value.trim(), password: document.getElementById("senha").value });
  if (r.error) { erro("E-mail ou senha incorretos."); b.disabled = false; return; }
  const a = await sb.rpc("e_autorizado");
  if (a.error || !a.data) { await sb.auth.signOut(); erro("Este usuário não tem acesso à P3."); b.disabled = false; return; }
  location.href = "index.html";
};
</script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script></body></html>
